<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DxPath – bedside diagnostic aid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F4;--card:#FFFFFF;--ink:#16233A;--muted:#5A6576;--line:#D6DCE1;
  --accent:#1F4E8C;--accent-ink:#FFFFFF;--accent-soft:#E4ECF7;
  --danger:#B3261E;--danger-bg:#FBEAE8;--warn:#8F5300;--warn-bg:#FFF2DC;
  --ok:#2E6B4A;--ok-bg:#E4F1E9;--track:#E2E7EB;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0F1622;--card:#172131;--ink:#E6ECF3;--muted:#9AA6B6;--line:#2A3749;
    --accent:#86AEEA;--accent-ink:#0F1622;--accent-soft:#1D2D45;
    --danger:#F2867D;--danger-bg:#3A1C1B;--warn:#F0B35A;--warn-bg:#33270F;
    --ok:#7FC79F;--ok-bg:#15301F;--track:#243245;color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:16px 16px 64px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0 12px;border-bottom:2px solid var(--ink)}
.brand{font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.brand small{display:block;font-weight:500;font-size:.85rem;color:var(--muted);letter-spacing:0}
.steps{display:flex;gap:4px;list-style:none;margin:0;padding:0;font-size:.85rem}
.steps li{padding:4px 10px;border-radius:999px;color:var(--muted);border:1px solid var(--line)}
.steps li.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.steps li.done{color:var(--ink)}
.notice{margin:14px 0;padding:10px 14px;border-left:4px solid var(--warn);background:var(--warn-bg);font-size:.88rem;border-radius:0 6px 6px 0}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start;margin-top:12px}
@media (max-width:860px){.grid{grid-template-columns:1fr}.aside{order:-1}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
h1{font-size:1.6rem;line-height:1.2;margin:4px 0 6px;letter-spacing:-.015em}
h2{font-size:1.15rem;margin:0 0 10px}
h3{font-size:1rem;margin:16px 0 6px}
p.lead{color:var(--muted);margin:0 0 16px}
label.f{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
input[type=number],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cc{text-align:left;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
.cc b{display:block}
.cc span{font-size:.8rem;color:var(--muted)}
.cc[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.flags{margin-top:16px;padding:12px 14px;border:1px solid var(--danger);background:var(--danger-bg);border-radius:8px}
.flags b{color:var(--danger)}
.flags ul{margin:6px 0 0;padding-left:18px;font-size:.9rem}
.q{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .t{font-size:.95rem}
.q .tests{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;min-width:46px;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true][data-v=y]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed=true][data-v=n]{background:var(--ink);color:var(--paper)}
@media (max-width:520px){.q{grid-template-columns:1fr}.seg{justify-self:start}}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{padding:11px 18px;border-radius:8px;border:1px solid var(--ink);background:var(--card);font-weight:700;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.aside{position:sticky;top:12px}
@media (max-width:860px){.aside{position:static}}
.ddx{list-style:none;margin:0;padding:0}
.ddx li{padding:8px 0}
.ddx .nm{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;font-weight:600}
.ddx .pc{font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--track);border-radius:4px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .35s ease}
.ddx li.out .nm{color:var(--muted);font-weight:500}
.ddx li.out .bar i{background:var(--muted)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.tag.miss{background:var(--danger-bg);color:var(--danger)}
.tag.lead{background:var(--ok-bg);color:var(--ok)}
.tag.pos{background:var(--accent-soft);color:var(--accent)}
.tag.low{background:var(--track);color:var(--muted)}
.hint{font-size:.8rem;color:var(--muted);margin-top:10px}
.dxcard{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:var(--card);overflow:hidden}
.dxcard summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.dxcard summary::-webkit-details-marker{display:none}
.dxcard .title{font-weight:700;font-size:1.05rem}
.dxcard .big{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.dxcard .why{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.dxcard .body{padding:0 16px 14px;border-top:1px solid var(--line)}
.dxcard ul{margin:4px 0;padding-left:18px}
.dxcard li{margin:3px 0;font-size:.93rem}
.dispo{padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:.92rem;margin-top:10px}
.src{font-size:.8rem;color:var(--muted);margin-top:10px}
.missbox{padding:12px 14px;border:1px dashed var(--danger);border-radius:8px;margin:10px 0 16px;font-size:.9rem}
.missbox b{color:var(--danger)}
textarea{width:100%;min-height:180px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
footer{margin-top:28px;font-size:.8rem;color:var(--muted)}
footer ol{padding-left:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">DxPath<small>History → exam → differential → CPG-based plan</small></div>
    <ol class="steps" id="steps"></ol>
  </header>
  <div class="notice">Clinical decision support only. It does not replace judgment, local protocols or antibiograms. Doses are for non-pregnant adults with normal renal and hepatic function; verify before prescribing.</div>
  <div class="grid">
    <main id="main"></main>
    <aside class="aside" id="aside"></aside>
  </div>
  <footer id="foot"></footer>
</div>

<script>
/* ============================================================
   KNOWLEDGE BASE
   Each complaint: dx (prior weight, optional age/sex modifier,
   miss = can't-miss diagnosis), hx (history items), pe (exam items).
   lr: { dxId: [LR if present, LR if absent] }
   LRs are approximations drawn from JAMA Rational Clinical
   Examination series, McGee's Evidence-Based Physical Diagnosis
   and guideline documents. Edit freely.
   ============================================================ */
const KB = {
chest:{
  name:"Chest pain", hint:"Acute or recent chest discomfort",
  flags:["Hypotension, shock or new arrhythmia","SpO₂ <90% or severe distress","Sudden tearing pain radiating to back","ST elevation on ECG – activate STEMI pathway"],
  dx:[
    {id:"acs",name:"Acute coronary syndrome",prior:20,miss:true,mod:(a,s)=>(a<30?.15:a<40?.4:a<55?1:1.6)*(s==="M"?1.3:1),
     m:{labs:["12-lead ECG within 10 minutes of arrival; repeat if pain recurs","High-sensitivity troponin at 0 and 1–2 h (0/1h or 0/2h algorithm)","CBC, creatinine/eGFR, electrolytes (K, Mg), RBS/HbA1c, lipid profile","Chest X-ray; echocardiogram for wall motion and LV function"],
     tx:["Aspirin 162–325 mg chewed, then 75–100 mg daily","P2Y12 inhibitor: ticagrelor 180 mg load then 90 mg BID, or clopidogrel 300–600 mg load then 75 mg daily","Anticoagulation: enoxaparin 1 mg/kg SC q12h (adjust for CrCl <30) or UFH","High-intensity statin: atorvastatin 80 mg daily","Nitroglycerin 0.4 mg SL q5 min ×3 for pain (avoid if SBP <90, RV infarct, PDE-5 inhibitor use)","Oral beta-blocker within 24 h if no heart failure, shock or bradycardia","STEMI: primary PCI (door-to-device ≤90 min); fibrinolysis within 30 min if PCI not available within 120 min"],
     dispo:"Admit to monitored/CCU bed. STEMI or very high-risk NSTE-ACS: immediate invasive strategy.",
     src:"2025 ACC/AHA/ACEP/NAEMSP/SCAI ACS Guideline; 2023 ESC ACS Guidelines; 2021 AHA/ACC Chest Pain Guideline"}},
    {id:"pe",name:"Pulmonary embolism",prior:6,miss:true,
     m:{labs:["Wells score; if low pre-test probability apply PERC rule","D-dimer (age-adjusted: age ×10 µg/L if >50) when probability is low/intermediate","CT pulmonary angiography if D-dimer positive or probability high; V/Q scan if contrast contraindicated","ECG, troponin, BNP/NT-proBNP, bedside echo for RV strain; lower-limb compression ultrasound","CBC, creatinine, PT/INR, aPTT"],
     tx:["Start anticoagulation while awaiting imaging if probability is high","Apixaban 10 mg BID ×7 d then 5 mg BID, or rivaroxaban 15 mg BID ×21 d then 20 mg daily; or enoxaparin 1 mg/kg SC q12h","High-risk PE (shock/SBP <90): systemic thrombolysis, alteplase 100 mg IV over 2 h, unless contraindicated","Treat for at least 3 months; longer if unprovoked or ongoing risk factor"],
     dispo:"Stratify with sPESI and RV/troponin: low risk may be managed as outpatient; intermediate–high and high risk admit.",
     src:"2019 ESC Acute PE Guidelines; ASH 2020 VTE Guidelines; CHEST 2021 VTE update"}},
    {id:"aad",name:"Acute aortic dissection",prior:2,miss:true,mod:a=>a<40?.3:a>60?1.6:1,
     m:{labs:["CT angiography of chest, abdomen and pelvis (TEE if unstable)","ECG, troponin, CBC, creatinine, type and crossmatch","Bedside echo for pericardial effusion and aortic root"],
     tx:["IV beta-blocker first (esmolol or labetalol): HR ≤60, then SBP 100–120 mmHg","Add IV vasodilator (e.g., nicardipine) only after rate control","IV opioid analgesia","Avoid antiplatelets/anticoagulants until dissection is excluded"],
     dispo:"Type A: emergency cardiothoracic surgery. Type B uncomplicated: ICU medical therapy.",
     src:"2022 ACC/AHA Aortic Disease Guideline; 2024 ESC Peripheral Arterial and Aortic Diseases"}},
    {id:"ptx",name:"Pneumothorax",prior:4,miss:true,mod:a=>a<40?1.5:1,
     m:{labs:["Upright PA chest X-ray; point-of-care lung ultrasound (absent lung sliding)","CT chest if X-ray equivocal or secondary pneumothorax","ABG if hypoxemic or with lung disease"],
     tx:["Tension pneumothorax: immediate needle decompression then chest tube – do not wait for X-ray","Primary, minimally symptomatic: conservative care or ambulatory device","Symptomatic/large: needle aspiration or small-bore chest drain","Supplemental oxygen; analgesia; refer to pulmonology for recurrence prevention"],
     dispo:"Admit secondary pneumothorax and any patient needing a drain.",
     src:"BTS Guideline for Pleural Disease 2023"}},
    {id:"peri",name:"Acute pericarditis",prior:5,
     m:{labs:["ECG: diffuse concave ST elevation with PR depression","CRP/ESR, troponin (myopericarditis if elevated), CBC","Echocardiogram for effusion/tamponade","Chest X-ray; consider TB work-up (endemic) if effusion or no response"],
     tx:["Ibuprofen 600 mg q8h (or aspirin 750–1000 mg q8h) for 1–2 weeks with PPI cover, then taper","Colchicine 0.5 mg BID (0.5 mg daily if <70 kg) for 3 months","Restrict strenuous exercise until symptoms and CRP resolve","Avoid corticosteroids as first-line"],
     dispo:"Outpatient if no high-risk features (fever >38 °C, large effusion, tamponade, troponin rise, no response to NSAID in 1 week).",
     src:"ESC Guidelines on Pericardial Diseases (2015) and 2025 ESC Myocarditis & Pericarditis Guidelines"}},
    {id:"gerd",name:"GERD / esophageal pain",prior:20,
     m:{labs:["Exclude cardiac cause first in patients with risk factors (ECG ± troponin)","Endoscopy if alarm features: dysphagia, weight loss, GI bleeding, anemia, persistent vomiting"],
     tx:["PPI trial: omeprazole 20–40 mg once daily before breakfast for 8 weeks","Lifestyle: weight loss, elevate head of bed, avoid late meals, alcohol and smoking"],
     dispo:"Outpatient follow-up in 4–8 weeks.",
     src:"ACG Clinical Guideline for GERD 2022"}},
    {id:"msk",name:"Musculoskeletal chest wall pain",prior:30,mod:a=>a<40?1.4:1,
     m:{labs:["Diagnosis of exclusion; ECG if any cardiac risk factor or atypical feature","Chest X-ray only if trauma or pulmonary signs"],
     tx:["Paracetamol 500–1000 mg q6h PRN (max 4 g/day) or topical/oral NSAID short course","Reassurance, activity modification, heat"],
     dispo:"Outpatient. Return if pain changes in character or exertional symptoms appear.",
     src:"2021 AHA/ACC Chest Pain Guideline; Harrison’s Principles of Internal Medicine"}}
  ],
  hx:[
    {id:"c1",q:"Pain brought on by exertion and relieved by rest",s:"exertional pain",lr:{acs:[2.4,.7],msk:[.6,1]}},
    {id:"c2",q:"Radiates to one or both arms or shoulders",s:"radiation to arm(s)",lr:{acs:[2.6,.8]}},
    {id:"c3",q:"Associated diaphoresis",s:"diaphoresis",lr:{acs:[2,.9]}},
    {id:"c4",q:"Pleuritic (worse on deep breathing)",s:"pleuritic pain",lr:{acs:[.2,1.2],pe:[1.5,.8],peri:[2.5,.6],ptx:[2,.7],msk:[1.5,.9]}},
    {id:"c5",q:"Worse lying flat, better sitting forward",s:"positional pain",lr:{peri:[5,.6]}},
    {id:"c6",q:"Sudden, tearing or ripping pain radiating to the back",s:"tearing pain to back",lr:{aad:[6,.3],acs:[.8,1]}},
    {id:"c7",q:"Sudden-onset shortness of breath",s:"sudden dyspnea",lr:{pe:[2.5,.6],ptx:[2.5,.6]}},
    {id:"c8",q:"Recent surgery, immobilization, long travel, active cancer or prior DVT/PE",s:"VTE risk factor",lr:{pe:[3,.7]}},
    {id:"c9",q:"Hemoptysis",s:"hemoptysis",lr:{pe:[2,.95]}},
    {id:"c10",q:"Burning, meal-related, with sour taste or regurgitation",s:"reflux features",lr:{gerd:[3,.6],acs:[.8,1]}},
    {id:"c11",q:"Diabetes, hypertension, smoking, dyslipidemia or premature family CAD",s:"CAD risk factors",lr:{acs:[1.8,.6]}},
    {id:"c12",q:"Known coronary disease or previous MI",s:"known CAD",lr:{acs:[2.2,.9]}},
    {id:"c13",q:"Viral illness in the past 2–3 weeks",s:"recent viral illness",lr:{peri:[2.5,.8]}},
    {id:"c14",q:"Tall thin build, smoker, COPD or recent chest trauma",s:"PTX risk",lr:{ptx:[3,.8]}},
    {id:"c15",q:"Worse with twisting or movement; recent strain",s:"movement-related",lr:{msk:[3,.6],acs:[.6,1]}}
  ],
  pe:[
    {id:"cp1",q:"HR >100 or SBP <90",s:"tachycardia/hypotension",lr:{pe:[2,.8],aad:[1.3,1],acs:[1.3,1]}},
    {id:"cp2",q:"Pulse deficit or arm SBP difference >20 mmHg",s:"pulse deficit",lr:{aad:[5.7,.7]}},
    {id:"cp3",q:"Focal neurologic deficit",s:"focal deficit",lr:{aad:[6,.9]}},
    {id:"cp4",q:"New diastolic murmur (aortic regurgitation)",s:"AR murmur",lr:{aad:[1.5,.9]}},
    {id:"cp5",q:"Pericardial friction rub",s:"friction rub",lr:{peri:[10,.8]}},
    {id:"cp6",q:"Pain reproduced by palpation of chest wall",s:"reproducible tenderness",lr:{msk:[3,.6],acs:[.3,1.1]}},
    {id:"cp7",q:"Unilateral absent breath sounds with hyperresonance",s:"unilateral absent BS",lr:{ptx:[10,.2]}},
    {id:"cp8",q:"New S3, basal crackles or hypotension",s:"S3/crackles",lr:{acs:[2,.95]}},
    {id:"cp9",q:"Unilateral calf swelling or tenderness",s:"DVT signs",lr:{pe:[3,.8]}},
    {id:"cp10",q:"SpO₂ <94% on room air",s:"hypoxemia",lr:{pe:[2,.7],ptx:[2,.8]}},
    {id:"cp11",q:"Epigastric tenderness",s:"epigastric tenderness",lr:{gerd:[1.5,.9]}}
  ]
},
fever:{
  name:"Fever", hint:"Acute febrile illness (tropical setting)",
  flags:["Hypotension, narrow pulse pressure (≤20 mmHg) or cold extremities","Dengue warning signs: abdominal pain, persistent vomiting, mucosal bleeding, lethargy, fluid accumulation","Altered sensorium, neck stiffness or seizures","Oliguria, jaundice or respiratory distress"],
  dx:[
    {id:"den",name:"Dengue",prior:20,
     m:{labs:["CBC with platelet and hematocrit – baseline then serial (daily or more in critical phase)","NS1 antigen (days 1–5) or dengue IgM/IgG (from day 5)","AST/ALT, albumin; creatinine, electrolytes if with warning signs","Ultrasound / chest X-ray (lateral decubitus) for plasma leakage if warning signs"],
     tx:["Group A (no warning signs, tolerating fluids, voiding q6h): home care, oral fluids/ORS, paracetamol for fever","Avoid NSAIDs, aspirin and IM injections","Group B (warning signs or comorbid): admit; isotonic crystalloid if oral intake inadequate, e.g., 5–7 mL/kg/h ×1–2 h then taper per hematocrit and clinical response","Group C (severe dengue/shock): emergency crystalloid resuscitation per WHO protocol; transfuse for significant bleeding","Teach warning signs; critical phase is around defervescence"],
     dispo:"Classify Group A/B/C each visit. Daily review until 48 h after defervescence.",
     src:"DOH dengue clinical management guidelines; PhilHealth Circular 2026-0009; WHO Dengue Guidelines 2009 & Handbook 2012"}},
    {id:"vir",name:"Viral URTI / influenza",prior:30,
     m:{labs:["Usually none; influenza/COVID-19 rapid test if it changes management","CBC if fever persists >3 days or toxic"],
     tx:["Paracetamol 500–1000 mg q6h PRN, fluids, rest","Oseltamivir 75 mg BID ×5 d for suspected influenza if high-risk, hospitalized or severe (best within 48 h)","No antibiotics for uncomplicated viral illness"],
     dispo:"Outpatient with return precautions.",
     src:"IDSA 2018 Influenza Guideline; WHO"}},
    {id:"uti",name:"Urinary tract infection / pyelonephritis",prior:12,mod:(a,s)=>s==="F"?1.6:.6,
     m:{labs:["Urinalysis (pyuria, nitrite)","Urine culture and sensitivity for pyelonephritis, complicated UTI, males, recurrence","CBC, creatinine; blood culture if septic","KUB ultrasound if obstruction suspected or no response in 48–72 h"],
     tx:["Uncomplicated cystitis: nitrofurantoin 100 mg BID ×5 d, or fosfomycin 3 g single dose","Pyelonephritis, outpatient: oral fluoroquinolone (e.g., ciprofloxacin 500 mg BID ×7 d) only if local resistance is low; otherwise first dose of ceftriaxone 1 g IV then oral agent per culture","Pyelonephritis, inpatient: ceftriaxone 1–2 g IV daily; adjust to culture"],
     dispo:"Admit if septic, vomiting, pregnant or obstructed.",
     src:"PSMID Philippine CPG on UTI in Adults 2015; IDSA 2011 & 2025 cUTI Guidelines"}},
    {id:"typ",name:"Typhoid fever",prior:6,
     m:{labs:["Blood culture (highest yield in first week); bone marrow culture if pre-treated","CBC (leukopenia, relative), AST/ALT","Serologic rapid tests have limited accuracy – interpret with caution"],
     tx:["Uncomplicated: azithromycin 500 mg–1 g PO daily ×7 d","Severe or unable to take oral: ceftriaxone 2 g IV daily ×10–14 d","Fluoroquinolone only if susceptibility confirmed"],
     dispo:"Admit if toxic, GI bleeding, perforation signs or altered sensorium.",
     src:"WHO typhoid guidance; PSMID antimicrobial guidance; Sanford Guide"}},
    {id:"lep",name:"Leptospirosis",prior:5,
     m:{labs:["CBC, creatinine, BUN, potassium, urinalysis","AST/ALT, bilirubin, CPK","Leptospira IgM / PCR (early) / MAT","Chest X-ray if dyspneic (pulmonary hemorrhage)"],
     tx:["Mild: doxycycline 100 mg BID ×7 d (or azithromycin)","Moderate–severe: penicillin G 1.5 MU IV q6h or ceftriaxone 1 g IV daily ×7 d","Early nephrology referral for oliguria/rising creatinine (dialysis)","Post-flood exposure prophylaxis: doxycycline 200 mg per CPG risk category"],
     dispo:"Admit moderate–severe disease (jaundice, oliguria, bleeding, dyspnea).",
     src:"Philippine CPG on Leptospirosis (PSMID/PSN/PCCP 2010); DOH"}},
    {id:"cap",name:"Community-acquired pneumonia",prior:10,
     m:{labs:["Chest X-ray PA","Low-risk CAP: no routine labs or sputum culture","Moderate/high-risk: CBC, BUN/creatinine, electrolytes, RBS, blood cultures, sputum GS/CS, ABG if hypoxemic"],
     tx:["Low-risk, no comorbid: amoxicillin 1 g TID, or co-amoxiclav / cefuroxime per 2020 update; macrolide alternative","Moderate-risk: IV non-antipseudomonal β-lactam (ampicillin-sulbactam, ceftriaxone, cefuroxime) + macrolide (azithromycin 500 mg daily)","High-risk: ICU; IV β-lactam + macrolide; antipseudomonal agent only if risk factors","Do not use fluoroquinolones as first-line (TB masking)"],
     dispo:"Low-risk outpatient; moderate- and high-risk admit.",
     src:"Philippine CPG on CAP in Immunocompetent Adults (PSMID 2016 Update; 2020 Update)"}},
    {id:"mal",name:"Malaria",prior:2,
     m:{labs:["Malaria smear (thick and thin) or RDT – repeat q12–24h ×3 if negative and suspicion remains","CBC, creatinine, bilirubin, RBS, G6PD before primaquine"],
     tx:["Uncomplicated P. falciparum: artemether-lumefantrine 6-dose course + single low-dose primaquine","P. vivax: chloroquine or ACT + primaquine 14 d after G6PD testing","Severe malaria: IV artesunate 2.4 mg/kg at 0, 12, 24 h then daily"],
     dispo:"Admit severe malaria. Notify DOH.",
     src:"DOH Malaria Control Program Manual; WHO Guidelines for Malaria"}}
  ],
  hx:[
    {id:"f1",q:"Fever for 7 days or less",s:"fever ≤7 days",lr:{den:[1.5,.3],vir:[1.2,.6],typ:[.6,1.8],lep:[1.1,.8]}},
    {id:"f2",q:"Retro-orbital pain, myalgia or arthralgia",s:"retro-orbital pain/myalgia",lr:{den:[2.5,.5],lep:[1.5,.8]}},
    {id:"f3",q:"Rash",s:"rash",lr:{den:[2,.8]}},
    {id:"f4",q:"Gum or nose bleeding, petechiae",s:"bleeding",lr:{den:[3,.85],lep:[1.3,1]}},
    {id:"f5",q:"Wading in floodwater or contact with rats/animal urine in past 2–4 weeks",s:"flood exposure",lr:{lep:[8,.3]}},
    {id:"f6",q:"Calf pain",s:"calf pain",lr:{lep:[3,.7]}},

/* ============================================================ ENGINE */
const S = {step:0, age:"", sex:"", cc:"", ans:{}};

function weights(){
  const c = KB[S.cc]; if(!c) return [];
  const age = +S.age, sex = S.sex;
  const feats = c.hx.concat(c.pe);
  let list = c.dx.map(d=>{
    const mod = d.mod ? d.mod(age,sex) : 1;
    let w = d.prior * mod, contrib=[];
    if(mod>0) feats.forEach(f=>{
      const a = S.ans[f.id], lr = f.lr[d.id];
      if(!a || a==="u" || !lr) return;
      const v = a==="y" ? lr[0] : lr[1];
      w *= v;
      if(v!==1) contrib.push({s:(a==="y"?"":"no ")+f.s, v});
    });
    return {d, w, contrib, excluded: mod===0};
  });
  const tot = list.reduce((t,x)=>t+x.w,0) || 1;
  list.forEach(x=>x.p = x.w/tot);
  return list.filter(x=>!x.excluded).sort((a,b)=>b.p-a.p);
}
function status(p,i){
  if(i===0 && p>=.4) return ["lead","Most likely"];
  if(p>=.15) return ["pos","Possible"];
  if(p>=.03) return ["low","Less likely"];
  return ["low","Ruled out (low probability)"];
}
const pct = p => (p<.01 ? "<1" : Math.round(p*100)) + "%";

  $("#steps").innerHTML = STEPS.map((n,i)=>`<li class="${i===S.step?"on":i<S.step?"done":""}">${i+1}. ${n}</li>`).join("");

  renderAside();
  $("#foot").innerHTML = `<b>Sources</b><ol>${SOURCES.map(s=>`<li>${s}</li>`).join("")}</ol><p>Probabilities are estimates from prior weights × likelihood ratios. They support, not replace, clinical judgment.</p>`;
}

  $("#main").innerHTML = `<div class="panel">

    <div class="cc-grid">${ccs}</div>
    ${c?`<div class="flags"><b>Red flags – act immediately if present</b><ul>${c.flags.map(f=>`<li>${f}</li>`).join("")}</ul></div>`:""}
    <div class="nav"><span></span><button class="btn primary" id="next" ${S.age===""||!S.sex||!S.cc?"disabled":""}>Start history</button></div>
  </div>`;
  $("#age").oninput = e=>{S.age=e.target.value; refreshPatientBtn()};
  $("#age").onchange = ()=>render();
  $("#sex").onchange = e=>{S.sex=e.target.value; render()};
  document.querySelectorAll(".cc").forEach(b=>b.onclick=()=>{ if(S.cc!==b.dataset.cc) S.ans={}; S.cc=b.dataset.cc; render()});
  $("#next").onclick = ()=>go(1);
}
function refreshPatientBtn(){ $("#next").disabled = S.age===""||!S.sex||!S.cc; renderAside(); }

function qRow(f, showTests){
  const v = S.ans[f.id]||"";
  const names = showTests ? Object.keys(f.lr).map(id=>KB[S.cc].dx.find(d=>d.id===id)?.name).filter(Boolean).join(", ") : "";
  return `<div class="q"><div class="t">${f.q}${showTests?`<span class="tests">Helps assess: ${names}</span>`:""}</div>
    <div class="seg" role="group" aria-label="${f.q}">
      <button data-id="${f.id}" data-v="y" aria-pressed="${v==="y"}">Yes</button>
      <button data-id="${f.id}" data-v="n" aria-pressed="${v==="n"}">No</button>
      <button data-id="${f.id}" data-v="u" aria-pressed="${v==="u"}">?</button>
    </div></div>`;
}
function bindSeg(){
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id, v=b.dataset.v;
    S.ans[id] = S.ans[id]===v ? undefined : v;
    b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x.dataset.v===S.ans[id]));
    renderAside();
  });
}

function renderHistory(){
  const c = KB[S.cc];
  $("#main").innerHTML = `<div class="panel">
    <h1>History: ${c.name.toLowerCase()}</h1>
    <p class="lead">${S.age}-year-old ${S.sex==="M"?"male":"female"}. Answer what you know; use “?” or leave blank if unknown.</p>
    ${c.hx.map(f=>qRow(f,false)).join("")}
    <div class="nav"><button class="btn" id="back">Back</button><button class="btn primary" id="next">Continue to physical exam</button></div>
  </div>`;
  bindSeg(); $("#back").onclick=()=>go(0); $("#next").onclick=()=>go(2);
}

function relevantExam(){
  const c = KB[S.cc], w = weights();
  const rel = new Set(w.filter(x=>x.p>=.02 || (x.d.miss && x.p>=.005)).map(x=>x.d.id));
  return c.pe
    .filter(f=>Object.keys(f.lr).some(id=>rel.has(id)))
    .map(f=>({f, power:Math.max(...Object.entries(f.lr).filter(([id])=>rel.has(id)).map(([,v])=>Math.max(Math.abs(Math.log(v[0])),Math.abs(Math.log(v[1])))))}))
    .sort((a,b)=>b.power-a.power).map(x=>x.f);
}
function renderExam(){
  const list = relevantExam();
  const hidden = KB[S.cc].pe.length - list.length;
  $("#main").innerHTML = `<div class="panel">
    <h1>Targeted physical exam</h1>
    <p class="lead">Ordered by how much each finding separates the diagnoses still in play. Record what you find.</p>
    ${list.map(f=>qRow(f,true)).join("")}
    ${hidden>0?`<p class="hint">${hidden} exam item(s) hidden because they only test diagnoses already ruled out.</p>`:""}
    <div class="nav"><button class="btn" id="back">Back</button><button class="btn primary" id="next">Show diagnosis and plan</button></div>
  </div>`;
  bindSeg(); $("#back").onclick=()=>go(1); $("#next").onclick=()=>go(3);
}

function why(x){
  const f = x.contrib.filter(c=>c.v>1).sort((a,b)=>b.v-a.v).slice(0,3).map(c=>c.s);
  const a = x.contrib.filter(c=>c.v<1).sort((a,b)=>a.v-b.v).slice(0,3).map(c=>c.s);
  return [f.length?`For: ${f.join(", ")}`:"", a.length?`Against: ${a.join(", ")}`:""].filter(Boolean).join(" | ") || "Based on age, sex and prevalence only";
}
function mgmt(d){
  const m=d.m;
  return `<h3>Labs and diagnostics</h3><ul>${m.labs.map(x=>`<li>${x}</li>`).join("")}</ul>
    <h3>Treatment</h3><ul>${m.tx.map(x=>`<li>${x}</li>`).join("")}</ul>
    <div class="dispo"><b>Disposition:</b> ${m.dispo}</div>
    <div class="src">Basis: ${m.src}</div>`;
}
function renderPlan(){
  const w = weights();
  const misses = w.filter((x,i)=>x.d.miss && x.p<.15 && i>0);
  const cards = w.map((x,i)=>{
    const [cls,label] = status(x.p,i);
    return `<details class="dxcard" ${i===0?"open":""}><summary>
      <span class="title">${x.d.name}<span class="tag ${cls}">${label}</span>${x.d.miss?'<span class="tag miss">Can’t miss</span>':""}</span>
      <span class="big">${pct(x.p)}</span><span class="why">${why(x)}</span></summary>
      <div class="body">${mgmt(x.d)}</div></details>`;
  }).join("");
  $("#main").innerHTML = `<div class="panel">
    <h1>Differential and plan</h1>
    <p class="lead">Tap any diagnosis to see its work-up and CPG-based treatment.</p>
    ${misses.length?`<div class="missbox"><b>Before closing:</b> low score does not exclude ${misses.map(x=>x.d.name.toLowerCase()).join(", ")}. If clinical concern remains, confirm with: ${misses.map(x=>x.d.m.labs[0].split(";")[0]).join("; ")}.</div>`:""}
    ${cards}
    <h3>Chart summary</h3>
    <textarea id="sum" readonly>${summary(w)}</textarea>
    <div class="nav"><button class="btn" id="back">Back</button><span><button class="btn" id="copy">Copy summary</button> <button class="btn primary" id="new">New patient</button></span></div>
  </div>`;
  $("#back").onclick=()=>go(2);
  $("#copy").onclick=async()=>{try{await navigator.clipboard.writeText($("#sum").value);$("#copy").textContent="Copied"}catch(e){$("#sum").select()}};
  $("#new").onclick=()=>{Object.assign(S,{step:0,age:"",sex:"",cc:"",ans:{}});render();scrollTo(0,0)};
}
function summary(w){
  const c=KB[S.cc], all=c.hx.concat(c.pe);
  const pos=all.filter(f=>S.ans[f.id]==="y").map(f=>f.s), neg=all.filter(f=>S.ans[f.id]==="n").map(f=>f.s);
  const top=w[0];
  return `${S.age}/${S.sex} – CC: ${c.name}
Pertinent (+): ${pos.join(", ")||"none recorded"}
Pertinent (−): ${neg.join(", ")||"none recorded"}
Assessment: ${w.slice(0,4).map(x=>`${x.d.name} ${pct(x.p)}`).join("; ")}
Plan (${top.d.name}):
- Labs: ${top.d.m.labs.join("; ")}
- Tx: ${top.d.m.tx.join("; ")}
- Dispo: ${top.d.m.dispo}`;
}

function renderAside(){
  const w = weights();
  if(!w.length){ $("#aside").innerHTML = `<div class="panel"><h2>Live differential</h2><p class="hint">Choose a chief complaint to see the differential update as you answer.</p></div>`; return; }
  const answered = Object.values(S.ans).filter(v=>v==="y"||v==="n").length;
  const show = window.matchMedia("(max-width:860px)").matches && S.step<3 ? w.slice(0,4) : w;
  $("#aside").innerHTML = `<div class="panel" aria-live="polite"><h2>Live differential</h2>
    <ul class="ddx">${show.map((x,i)=>{const [cls,label]=status(x.p,i);return `<li class="${x.p<.03?"out":""}"><div class="nm"><span>${x.d.name}${x.d.miss?'<span class="tag miss">!</span>':""}</span><span class="pc">${pct(x.p)}</span></div><div class="bar"><i style="width:${Math.max(1,x.p*100)}%"></i></div></li>`}).join("")}</ul>
    <p class="hint">${answered} finding${answered===1?"":"s"} entered. <span class="tag miss">!</span> = can’t-miss diagnosis.</p></div>`;
}

function go(n){S.step=n; render(); scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});}
render();
</script>
</body>
</html>
